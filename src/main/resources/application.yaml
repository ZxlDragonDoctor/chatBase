server:
  port: 8080

spring:
  application:
    name: chatBase
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: jdbc:mysql://localhost:3306/chat_base?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: zxl123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  redis:
    host: localhost
    port: 6379
    database: 0

chat:
  # 单个会话最大轮数，超过后自动开启新会话
  max-turns-per-session: 20
  # 会话相关 key 的过期天数
  session-ttl-days: 7
  # 群聊 @ 机器人限流（按 groupId+userId）
  rate-limit:
    window-seconds: 5
    max-requests: 1

# IM消息同步配置
im:
  sync:
    stream:
      enabled: true
    polling:
      enabled: false


